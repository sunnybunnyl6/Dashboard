<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-extra.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="settings-panel" class="settings-panel">
    <div class="settings-header">
        <h2>Dashboard Settings</h2>
        <button class="close-btn" onclick="toggleSettings()">✕</button>
    </div>
    
    <div class="settings-section">
        <label>Theme</label>
        <div class="theme-selector">
            <button class="theme-btn" data-theme="light" onclick="setTheme('light')">☀️ Light</button>
            <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">🌙 Dark</button>
            <button class="theme-btn" data-theme="navy" onclick="setTheme('navy')">🌊 Navy</button>
            <button class="theme-btn" data-theme="forest" onclick="setTheme('forest')">🌲 Forest</button>
        </div>
    </div>

    <div class="settings-section">
        <label>Primary Color</label>
        <input type="color" id="accent-color" onchange="updateAccentColor(this.value)" value="#6c5ce7">
    </div>

    <div class="settings-section">
        <label>Dashboard Title</label>
        <input type="text" id="dashboard-title" placeholder="My Dashboard" onchange="updateTitle(this.value)">
    </div>

    <div class="settings-section">
        <label>Grid Size</label>
        <input type="range" id="grid-size" min="20" max="50" value="30" onchange="updateGridSize(this.value)">
    </div>

    <div class="settings-section">
        <label>Actions</label>
        <button class="action-btn" onclick="exportBoard()">📥 Export Dashboard</button>
        <button class="action-btn" onclick="document.getElementById('import-file').click()">📤 Import Dashboard</button>
        <input type="file" id="import-file" style="display:none;" onchange="importBoard(this)">
        <button class="action-btn danger" onclick="clearBoard()">🗑️ Clear All</button>
    </div>
</div>

<div id="container">
    <div class="dashboard-header">
        <h1 id="title-display">Dashboard</h1>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleSettings()" title="Settings">⚙️</button>
        </div>
    </div>
    <div class="grid-stack"></div>
</div>

<div id="dock">
    <div class="dock-label">Add Widget</div>
    <div class="dock-item" onclick="addNewBlock('text')" title="Text Note">📝</div>
    <div class="dock-item" onclick="addNewBlock('embed')" title="Embed (YouTube, Spotify)">🔗</div>
    <div class="dock-item" onclick="addNewBlock('image')" title="Image">🖼️</div>
    <div class="dock-item" onclick="addNewBlock('clock')" title="Clock">🕐</div>
    <div class="dock-item" onclick="addNewBlock('weather')" title="Weather">🌤️</div>
    <div class="dock-item" onclick="addNewBlock('todo')" title="Todo List">✅</div>
    <div style="width:1px; background:var(--border); margin:5px 0;"></div>
    <div class="dock-item" onclick="saveBoard()" title="Save Dashboard">💾</div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack.all.nomin.js"></script>
<script src="script.js"></script>

</body>
</html>
